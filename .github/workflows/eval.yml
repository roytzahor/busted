name: Eval — precision gate

# The regression guardrail for the verdict pipeline. Replays the fixture
# corpus with cached AI responses (zero API spend) and fails on:
#   - any verdict/supplier fixture failure
#   - any Tier-0 fingerprint false fire (non-dropship fixture firing)
#   - mean projected scan cost over budget (--enforce-cost)
on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval:
    name: Lint + typecheck + fixture replay
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Unit tests were never run in CI before spec 0001 — 237 tests existed
      # and could rot unnoticed. `npm test` also carries the repo-wide SDD
      # gate (__tests__/sdd-specs.test.ts); sdd:check prints the AC → test
      # traceability matrix into the log so a reviewer can read it.
      - name: Unit tests (includes the spec gate)
        run: npm test

      - name: Spec check (agent-os/specs)
        run: npm run sdd:check

      # npm run eval passes --env-file=.env to tsx, which errors when the
      # file is missing. The replay needs no secrets — an empty file is fine.
      - name: Create empty .env
        run: touch .env

      - name: Fixture replay (cached AI, cost-enforced)
        run: npm run eval -- --skip-ai --enforce-cost

      # Frontend performance gate. The replay above guards AI cost; nothing
      # guarded shipped page weight, so it could drift up one PR at a time with
      # no signal. Bundle bytes are the deterministic input behind the LCP/INP
      # budgets in DESIGN.md §9 — a real browser measurement needs a browser,
      # but this catches what actually moves those numbers.
      - name: Production build
        run: npm run build

      - name: Bundle budget
        run: npm run perf:budget
